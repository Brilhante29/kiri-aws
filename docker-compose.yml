version: '3.8'

services:
  kiri-aws:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kiri-aws
    ports:
      - "4566:4566"
    environment:
      - KIRI_HOST=0.0.0.0
      - KIRI_PORT=4566
      - KIRI_DATA_DIR=/data
    volumes:
      - kiri_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  kiri_data:
