name: Integration Test

# Runs on the untrusted `pull_request` trigger (not `pull_request_target`) so a
# fork's code is never executed with repository secrets or a write-scoped token.
on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: Build with coverage
        run: |
          mkdir -p bin coverage
          go build -cover -covermode=atomic -o bin/kiri ./cmd/kiri

      - name: Start kiri with coverage
        run: |
          GOCOVERDIR=coverage bin/kiri --host 0.0.0.0 --port 4566 &
          echo $! > kiri.pid

      - name: Wait for kiri to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4566/health | grep -q "healthy"; then
              echo "kiri is ready"
              exit 0
            fi
            echo "Waiting for kiri..."
            sleep 1
          done
          echo "kiri failed to start"
          exit 1

      - name: Run integration tests
        run: make test-integration

      - name: Stop kiri
        if: always()
        run: |
          if [ -f kiri.pid ]; then
            kill $(cat kiri.pid) 2>/dev/null || true
            sleep 2
          fi

      - name: Generate coverage report
        if: always()
        id: coverage
        run: |
          if [ -d coverage ] && [ "$(ls -A coverage)" ]; then
            go tool covdata textfmt -i=coverage -o=coverage.out
            COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
            echo "## Integration Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Coverage: $COVERAGE**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Integration Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**No coverage data collected**" >> $GITHUB_STEP_SUMMARY
          fi
