name: Release

# Fully automated release pipeline.
#
#   1. Every push to main runs release-please, which keeps a "chore: release X"
#      pull request up to date from the conventional-commit history (version
#      bump + CHANGELOG + version.go + Helm chart version).
#   2. Merging that PR creates the git tag and the GitHub release, and sets
#      release_created=true.
#   3. The goreleaser job then builds the cross-platform binaries and the
#      multi-arch container image, generates an SBOM, signs everything keylessly
#      with cosign, and attaches SLSA build provenance.
#
# The two jobs live in one workflow on purpose: a tag pushed by GITHUB_TOKEN does
# not trigger a separate `on: push: tags` workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish the artifacts for an existing tag (e.g. v0.26.0). Leave empty to only refresh the release PR."
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: Publish artifacts
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signing + provenance
      attestations: write # SLSA build provenance
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance for the release binaries
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*_checksums.txt"

  helm:
    name: Publish Helm chart
    needs: [release-please, goreleaser]
    if: always() && needs.goreleaser.result == 'success' && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint the chart
        run: helm lint charts/kiri

      - name: Package and push the chart
        env:
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          # OCI registries reject upper-case repository names, and the GitHub
          # owner is mixed case.
          OWNER_LC="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "${HELM_REGISTRY_PASSWORD}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm package charts/kiri --version "${VERSION}" --app-version "${VERSION}"
          helm push "kiri-${VERSION}.tgz" "oci://ghcr.io/${OWNER_LC}/charts"
