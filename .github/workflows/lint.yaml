name: Lint

# Uses the untrusted `pull_request` trigger (not `pull_request_target`) so a
# fork's code is never linted with repository secrets or a write-scoped token.
on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            test/go.sum
      - name: golangci-lint
        run: |
          go mod download
          make lint
