name: govulncheck

on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = JST 4:00
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (root)
        id: root
        run: |
          set +e
          govulncheck --json ./... > /tmp/govulncheck-root.json 2>&1
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run govulncheck (test)
        id: test
        working-directory: test
        run: |
          set +e
          govulncheck --json ./... > /tmp/govulncheck-test.json 2>&1
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Create issues for vulnerabilities
        if: steps.root.outputs.exit_code != '0' || steps.test.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          create_issue_if_new() {
            local vuln_id="$1"
            local module="$2"
            local title="govulncheck: ${vuln_id} in ${module}"

            # Check for existing open issue with the same vuln ID
            existing=$(gh issue list --state open --search "${vuln_id}" --json number --jq 'length')
            if [ "$existing" -gt 0 ]; then
              echo "Issue for ${vuln_id} already exists, skipping."
              return
            fi

            gh issue create \
              --title "${title}" \
              --body "\`govulncheck\` detected **${vuln_id}** in \`${module}\`.

          See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full output.

          Reference: https://pkg.go.dev/vuln/${vuln_id}" \
              --label bug
          }

          # Parse vulnerabilities from JSON output
          for file in /tmp/govulncheck-root.json /tmp/govulncheck-test.json; do
            if [ ! -f "$file" ]; then
              continue
            fi
            # Extract vulnerable modules (only reachable vulnerabilities)
            jq -r '.Vulnerabilities[]? | select(.Reachable) | .OSV as $osv | .Modules[] | "\($osv):\(.Module)"' "$file" | sort -u | while IFS=: read -r vuln_id module; do
              create_issue_if_new "$vuln_id" "$module"
            done
          done
