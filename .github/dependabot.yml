version: 2

# Grouped updates keep the noise down: one PR per ecosystem per week for all
# minor/patch bumps (these are eligible for auto-merge once CI is green — see
# .github/workflows/dependabot-auto-merge.yaml), and a separate PR for
# major-version bumps, which always require a human review.
updates:
  # ---- Go modules: main module ----
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  # ---- Go modules: integration test module ----
  - package-ecosystem: gomod
    directory: /test
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "go", "test"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      test-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      test-major:
        patterns: ["*"]
        update-types: ["major"]

  # ---- Go modules: tools module (golangci-lint, etc.) ----
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "go", "tools"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      tools-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      tools-major:
        patterns: ["*"]
        update-types: ["major"]

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  # ---- Docker base images ----
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]
