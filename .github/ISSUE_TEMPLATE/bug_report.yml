name: Bug report
description: Something in kiro-aws does not behave like real AWS or the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve kiro-aws. Please fill in what you can.
  - type: input
    id: service
    attributes:
      label: Service
      description: Which AWS service or endpoint is affected?
      placeholder: S3, DynamoDB, SQS, Cost Explorer, ...
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: How are you connecting?
      options:
        - AWS SDK for Go
        - boto3 (Python)
        - AWS SDK for JavaScript
        - AWS SDK for Java
        - AWS CLI
        - Terraform
        - REST / curl
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What would real AWS (or the docs) do here?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the error and, if useful, the HTTP status or error code.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or CLI command is ideal.
      render: shell
  - type: input
    id: version
    attributes:
      label: kiro-aws version / image
      placeholder: commit SHA, tag, or "built from main"
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Docker version, Go version if building from source.
